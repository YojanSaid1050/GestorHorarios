name: Publicar una versión

# Se dispara al empujar una etiqueta v4.0.0, v4.0.1… Nunca en cada commit: una
# versión publicada es algo que alguien decide, no un efecto secundario de
# guardar código.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    # Sin esto, algo que se queda esperando corre hasta el tope de GitHub —seis
    # horas— gastando minutos y sin decir nada. Con el tope aquí, un cuelgue se
    # convierte en un fallo con su registro a los veinticinco minutos.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install -r requisitos.txt -r empaquetado/requisitos-construccion.txt

      - name: Dejar escrito con qué versiones se probó
        # Un registro de publicación tiene que poder contestar «¿con qué se
        # construyó aquello?» dentro de un año. Y si alguna vez las versiones
        # vuelven a irse por su cuenta, esto lo deja a la vista en vez de que se
        # note el día que algo se rompe sin que nadie haya tocado nada.
        run: python -m pip list

      - name: Comprobar que la etiqueta y la versión del programa coinciden
        # Publicar la etiqueta v4.0.1 con el programa diciendo 4.0.0 deja a la
        # aplicación instalada creyendo que ya está al día. Se para aquí.
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            throw 'Publicar requiere una etiqueta vX.Y.Z. Para probar main usa el workflow de revisión.'
          }
          $enElCodigo = python -c "from gestor.version import VERSION; print(VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo leer la versión del programa.' }
          $enLaEtiqueta = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($enElCodigo -ne $enLaEtiqueta) {
            Write-Error "La etiqueta dice $enLaEtiqueta y gestor/version.py dice $enElCodigo."
            exit 1
          }

      - name: Revisar el código con Ruff
        run: python -m ruff check gestor empaquetado pruebas qa

      - name: Pasar la batería de pruebas
        # No se publica lo que no pasa sus propias pruebas.
        #
        # En claro y no en `-q`, a propósito: con `-q` la salida es una fila de
        # puntos, y cuando una prueba se queda colgada el registro no dice cuál.
        # Costó dos vueltas enteras averiguar dónde se había parado. Con `-v`
        # cada nombre sale antes de ejecutarse, así que el último que aparece
        # **es** el que no terminó.
        #
        # `-x` para en el primer fallo: aquí no interesa el listado completo,
        # interesa no gastar una máquina Windows en las cuatrocientas pruebas
        # que vienen después de la que ya falló.
        run: python -m pytest --lentas -v -x --durations=15

      - name: Enseñar dónde se quedó, si se quedó
        # Solo corre cuando el paso de arriba ha fallado. El tope por prueba deja
        # la pila escrita en la salida, pero si lo que se colgó fue el proceso
        # entero —y no una prueba— esto es lo único que queda para mirar.
        if: failure()
        shell: pwsh
        run: |
          Write-Host "La batería no terminó. El último nombre que aparece arriba"
          Write-Host "es la prueba que no llegó a acabar."
          Write-Host "Para repetirlo en un Windows cualquiera, en la carpeta del proyecto:"
          Write-Host "    python -m pytest -v -x"


      - name: Instalar vpk
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Instalar Inno Setup desde la fuente oficial
        shell: pwsh
        timeout-minutes: 5
        run: ./empaquetado/preparar_inno.ps1
      - name: Compilar el asistente antes de construir la aplicación
        timeout-minutes: 3
        run: python -m empaquetado.comprobar_sintaxis_inno

      - name: Comprobar que la plantilla de la oficina está puesta
        # El repositorio es público, así que lo que hay escrito en él son
        # dieciocho personas inventadas. La de verdad llega en este secreto. Sin
        # él se construiría un instalador que arranca perfectamente y que la
        # oficina no puede usar: sin su gente y sin sus dos meses base, que son
        # el punto de partida del que cuelga todo lo demás.
        shell: pwsh
        env:
          GESTOR_NOMINA: ${{ secrets.GESTOR_NOMINA }}
          GESTOR_PERMISO: ${{ secrets.GESTOR_PERMISO }}
        run: |
          if (-not $env:GESTOR_NOMINA) {
            Write-Error ("Falta el secreto GESTOR_NOMINA. Se publicaria un " +
              "instalador con dieciocho personas inventadas dentro.")
            exit 1
          }

      - name: Crear el ejecutable y comprobar el servidor
        env:
          GESTOR_NOMINA: ${{ secrets.GESTOR_NOMINA }}
          GESTOR_PERMISO: ${{ secrets.GESTOR_PERMISO }}
        run: python empaquetado/construir.py --solo-exe

      - name: Comprobar la ventana real antes de publicar
        shell: pwsh
        timeout-minutes: 3
        run: ./empaquetado/comprobar_ventana.ps1

      - name: Crear paquetes de Velopack y asistente de Inno Setup
        run: python -c "from empaquetado.construir import empaquetar; empaquetar()"

      - name: Probar destinos e instalación real del asistente
        timeout-minutes: 10
        run: python empaquetado/comprobar_instalador.py

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GestorHorarios-diagnostico-publicacion
          path: dist/diagnostico/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publicar en la versión de GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: dist/instalador/*
          generate_release_notes: true

name: Revisar refactorización e instalador
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias de Python
        run: python -m pip install -r requisitos.txt -r empaquetado/requisitos-construccion.txt
      - name: Instalar Velopack
        run: dotnet tool install -g vpk --version 1.2.0
      - name: Instalar Inno Setup desde la fuente oficial
        shell: pwsh
        timeout-minutes: 5
        run: ./empaquetado/preparar_inno.ps1
      - name: Revisar el código con Ruff
        run: python -m ruff check gestor empaquetado pruebas qa
      - name: Probar las funciones
        run: python -m pytest --lentas -v --durations=15
      - name: Crear el ejecutable y comprobar el servidor con datos de ejemplo
        run: python empaquetado/construir.py --solo-exe
      - name: Abrir WebView2 y probar el puente del ejecutable real
        shell: pwsh
        timeout-minutes: 3
        run: ./empaquetado/comprobar_ventana.ps1
      - name: Crear paquetes de Velopack y asistente de Inno Setup
        run: python -c "from empaquetado.construir import empaquetar; empaquetar()"
      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GestorHorarios-diagnostico-Windows
          path: dist/diagnostico/
          if-no-files-found: ignore
          retention-days: 7
      - name: Guardar instalador comprobado
        uses: actions/upload-artifact@v4
        with:
          name: GestorHorarios-revision-Windows
          path: dist/instalador/
          if-no-files-found: error
          retention-days: 7
